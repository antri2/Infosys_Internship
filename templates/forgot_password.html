{% extends "base.html" %}
{% block title %}Reset Password - CareerAI{% endblock %}
{% block content %}

<nav class="navbar">
    <a href="{{ url_for('landing') }}" class="logo">&#127891; CareerAI</a>
</nav>

<div class="auth-page">
    <div class="auth-card">
        <h1>Reset Password</h1>
        <p class="auth-sub">Enter your email and we'll send you a reset link.</p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>

        <p class="auth-switch"><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
    </div>
</div>

{% endblock %}
