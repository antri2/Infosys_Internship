{% extends "base.html" %}
{% block title %}Login - CareerAI{% endblock %}
{% block content %}

<nav class="navbar">
    <a href="{{ url_for('landing') }}" class="logo">&#127891; CareerAI</a>
</nav>

<div class="auth-page">
    <div class="auth-card">
        <h1>Welcome Back</h1>
        <p class="auth-sub">Login to continue your career journey.</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <p class="forgot-link"><a href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a></p>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-switch">New to CareerAI? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div>
</div>

{% endblock %}
