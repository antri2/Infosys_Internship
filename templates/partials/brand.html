{# CareerAI wordmark. The mark is a three-node graph rather than a generic
   emoji: it echoes the skill-to-role matching the product performs.
   `size` is optional so the navbar, the auth cards and the footer can share it. #}
{% macro brand_mark(cls="sc-brand__mark") %}
<span class="{{ cls }}" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <line x1="12" y1="5"  x2="5"  y2="17"></line>
        <line x1="12" y1="5"  x2="19" y2="17"></line>
        <line x1="5"  y1="17" x2="19" y2="17"></line>
        <circle cx="12" cy="5"  r="2.4" fill="#fff"></circle>
        <circle cx="5"  cy="17" r="2.4"></circle>
        <circle cx="19" cy="17" r="2.4"></circle>
    </svg>
</span>
{% endmacro %}
